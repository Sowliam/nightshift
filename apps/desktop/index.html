<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NIGHTSHIFT</title>
    <meta name="application-name" content="NIGHTSHIFT" />
    <meta name="description" content="NIGHTSHIFT - Low Latency Voice & Gaming Community" />
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- DNS prefetch & Preconnect for maximum network performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Non-blocking Google Fonts with font-display: swap -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-bg-main text-text-primary overflow-hidden select-none antialiased font-sans">
    <div id="root" class="w-screen h-screen flex flex-col">
      <div id="app-splash" style="position:fixed;inset:0;background:#0A0908;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;">
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <div style="position:absolute;inset:-10px;border-radius:32px;background:radial-gradient(circle,rgba(82,183,136,0.35) 0%,transparent 70%);animation:splash-pulse 2s infinite ease-in-out;"></div>
          <img src="/logo.png" style="width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(82,183,136,0.5));position:relative;z-index:2;" alt="NIGHTSHIFT" />
        </div>
        <div style="color:#FFFFFF;font-size:18px;font-weight:900;letter-spacing:3px;margin-bottom:10px;">NIGHTSHIFT</div>
        <div style="display:flex;align-items:center;gap:8px;color:#80848E;font-size:11px;font-weight:700;letter-spacing:1px;">
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#52B788;box-shadow:0 0 8px #52B788;animation:splash-ping 1.2s infinite;"></span>
          <span>CONNECTING TO HIGH-SPEED AUDIO MESH...</span>
        </div>
        <style>
          @keyframes splash-pulse { 0%,100%{transform:scale(0.92);opacity:0.4} 50%{transform:scale(1.15);opacity:0.9} }
          @keyframes splash-ping { 0%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(1.4)} 100%{opacity:1;transform:scale(1)} }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
